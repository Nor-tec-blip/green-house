<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Monitoring IoT</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="dashboard-body">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="img/logo.png" alt="Logo" />
      <span>IoT Monitor</span>
    </div>

    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-section="sensor">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83
          M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
        </svg>
        <span>Sensor</span>
      </a>
      <a href="#" class="nav-item" data-section="riwayat">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>Riwayat</span>
      </a>
      <a href="#" class="nav-item" data-section="pengaturan">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83
          2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1
          1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0
          00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0
          004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0
          004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65
          1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0
          001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65
          1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0
          00-1.51 1z"/>
        </svg>
        <span>Pengaturan</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-logout" id="logoutBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Keluar</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Header -->
    <header class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <h2 class="topbar-title" id="topbarTitle">Sensor</h2>
      <div class="topbar-right">
        <span class="topbar-time" id="topbarTime"></span>
      </div>
    </header>

    <!-- Section: Sensor -->
    <section class="section active" id="section-sensor">
      <div class="sensor-grid" id="sensorGrid">
        <!-- Kartu sensor dirender oleh JS -->
      </div>
    </section>

    <!-- Section: Riwayat -->
    <section class="section" id="section-riwayat">
      <div class="table-wrapper">
        <div class="table-toolbar">
          <input type="text" id="searchRiwayat" placeholder="Cari sensor atau nilai..." class="search-input" />
          <button class="btn btn-secondary" id="exportBtn">Export CSV</button>
        </div>
        <table class="data-table" id="riwayatTable">
          <thead>
            <tr>
              <th>Waktu</th>
              <th>Sensor</th>
              <th>Nilai</th>
              <th>Satuan</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="riwayatBody">
            <!-- Dirender oleh JS -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Section: Pengaturan -->
    <section class="section" id="section-pengaturan">
      <div class="settings-wrapper">
        <h3 class="settings-title">Ganti Nama Sensor</h3>
        <p class="settings-desc">Klik pada nama sensor untuk mengeditnya langsung.</p>
        <div class="settings-list" id="settingsList">
          <!-- Dirender oleh JS -->
        </div>
        <button class="btn btn-primary" id="saveNamesBtn">Simpan Perubahan</button>
        <p class="save-msg" id="saveMsg"></p>
      </div>
    </section>

  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
